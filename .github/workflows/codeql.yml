name: CodeQL Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-java-kotlin:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      JIEXI_USE_MIRROR: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Build analyzed source
        shell: pwsh
        run: .\gradlew.bat --no-daemon :sharedCore:test :app:compileDebugKotlin :desktopApp:classes
      - uses: github/codeql-action/analyze@v4

  analyze-csharp:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build installer migration helper and its test harness
        shell: pwsh
        run: dotnet build desktopApp/installerHelper.Tests/JieXiPreserveData.Tests.csproj --configuration Release --framework net8.0-windows
      - uses: github/codeql-action/analyze@v4
