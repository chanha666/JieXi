name: CodeQL Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      JIEXI_USE_MIRROR: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
      - name: Build analyzed source
        shell: pwsh
        run: .\gradlew.bat --no-daemon :desktopApp:classes
      - uses: github/codeql-action/analyze@v3
