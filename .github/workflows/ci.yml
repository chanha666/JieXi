name: Windows Desktop CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      JIEXI_USE_MIRROR: "false"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "17"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run Windows desktop tests
        shell: pwsh
        run: .\gradlew.bat --no-daemon :desktopApp:test

      - name: Build portable Windows application
        shell: pwsh
        run: .\gradlew.bat --no-daemon :desktopApp:packagePortable

      - name: Create portable archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path desktopApp/build/portable/解析 -DestinationPath JieXi-Windows-Portable.zip -Force
          (Get-FileHash JieXi-Windows-Portable.zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  JieXi-Windows-Portable.zip" | Set-Content SHA256SUMS.txt -Encoding ascii

      - name: Upload verified Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: JieXi-Windows-${{ github.sha }}
          path: |
            JieXi-Windows-Portable.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
